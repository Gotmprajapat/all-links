<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - My Deals</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="admin">

  <div id="loginBox" class="box">
    <h2>🔐 Admin Login</h2>

    <input id="email" type="email" placeholder="Admin email">
    <input id="password" type="password" placeholder="Password">

    <button id="loginBtn">Login</button>

    <p id="loginMessage"></p>
  </div>


  <div id="adminPanel" style="display:none;">

    <div class="admin-header">
      <div>
        <h1>🔥 My Deals</h1>
        <p>Product Admin Panel</p>
      </div>

      <button id="logoutBtn">Logout</button>
    </div>


    <div class="box">

      <h2>Add Product</h2>

      <input id="productName"
        type="text"
        placeholder="Product name">

      <input id="productImage"
  type="file"
  accept="image/*">

<img id="imagePreview"
  style="display:none;width:120px;height:120px;object-fit:contain;margin:10px 0;border-radius:10px;">

      <input id="productPrice"
        type="text"
        placeholder="Current price">

      <input id="productOldPrice"
        type="text"
        placeholder="Old price (optional)">

      <textarea id="productDescription"
        placeholder="Short description"></textarea>

      <input id="productLink"
        type="url"
        placeholder="Flipkart affiliate link">

      <button id="addBtn">➕ Add Product</button>

      <p id="message"></p>

    </div>


    <h2>Saved Products</h2>

    <div id="adminProducts"></div>

  </div>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>
